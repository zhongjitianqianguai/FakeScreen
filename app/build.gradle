plugins {
    id 'com.android.application'
}

android {
    namespace = 'me.neversleep.plusplus'
    compileSdk = 37

    defaultConfig {
        applicationId = "me.neversleep.plusplus"
        minSdk = 21
        targetSdk = 37
        versionCode = 20
        versionName = "1.8.2"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    flavorDimensions += 'xposedApi'
    productFlavors {
        modern {
            dimension = 'xposedApi'
            minSdk = 26
        }
        legacy {
            dimension = 'xposedApi'
            minSdk = 21
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    testImplementation 'junit:junit:4.13.2'
    modernCompileOnly 'io.github.libxposed:api:102.0.0'
    modernImplementation 'io.github.libxposed:service:102.0.0'
    legacyCompileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.10.0'
}
